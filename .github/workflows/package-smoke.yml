name: Package Installation Smoke

on:
  push:
    paths:
      - 'agentweave/**'
      - 'agentweave_byom/**'
      - 'agentweave_security/**'
      - 'pyproject.toml'
      - '.github/workflows/package-smoke.yml'
  pull_request:
    paths:
      - 'agentweave/**'
      - 'agentweave_byom/**'
      - 'agentweave_security/**'
      - 'pyproject.toml'
      - '.github/workflows/package-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wheel
          path: dist/*.whl

  install-smoke:
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [base, mcp, langgraph, autogen]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-wheel
          path: dist
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install wheel in a fresh virtual environment
        run: |
          python -m venv /tmp/agentweave-smoke
          WHEEL=$(ls dist/*.whl)
          if [ '${{ matrix.extra }}' = 'base' ]; then
            /tmp/agentweave-smoke/bin/pip install "$WHEEL"
          else
            /tmp/agentweave-smoke/bin/pip install "${WHEEL}[${{ matrix.extra }}]"
          fi
      - name: Verify canonical imports and CLI
        run: |
          /tmp/agentweave-smoke/bin/python - <<'PY'
          import agentweave
          from agentweave import AgentWeaveApplication, AgentWeaveRuntime, ToolSpec
          from agentweave_byom import OpenAICompatibleModelAdapter
          from agentweave_security.authorization import AuthorizationDecision
          print(agentweave.__version__)
          assert AgentWeaveApplication and AgentWeaveRuntime and ToolSpec
          assert OpenAICompatibleModelAdapter and AuthorizationDecision
          PY
          /tmp/agentweave-smoke/bin/agentweave version
      - name: Verify selected integration import
        if: matrix.extra != 'base'
        run: |
          case '${{ matrix.extra }}' in
            mcp) /tmp/agentweave-smoke/bin/python -c 'from mcp import Client; from agentweave.integrations.mcp import MCPToolCatalog' ;;
            langgraph) /tmp/agentweave-smoke/bin/python -c 'from langgraph.graph import StateGraph; from agentweave.integrations.langgraph import AgentWeaveLangGraphNode' ;;
            autogen) /tmp/agentweave-smoke/bin/python -c 'import autogen_agentchat; from agentweave.integrations.autogen import AgentWeaveAutoGenSelector' ;;
          esac

  install-smoke-python314:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-wheel
          path: dist
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install base wheel on Python 3.14
        run: |
          python -m venv /tmp/agentweave-smoke-314
          WHEEL=$(ls dist/*.whl)
          /tmp/agentweave-smoke-314/bin/pip install "$WHEEL"
          /tmp/agentweave-smoke-314/bin/python -c 'import agentweave, agentweave_byom, agentweave_security; print(agentweave.__version__)'
          /tmp/agentweave-smoke-314/bin/agentweave version
