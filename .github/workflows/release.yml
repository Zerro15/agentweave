name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish to PyPI using trusted publishing (tag refs only)
        required: false
        default: false
        type: boolean

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install -U pip build twine && pip install -e '.[dev]'
      - name: Test core
        run: pytest -q
      - name: Test supported upstream integrations
        run: |
          pip install -e '.[dev,all-integrations]'
          pytest -q tests/test_upstream_integration_compat.py
      - name: Verify release version metadata
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          pyproject = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          package_version = pyproject['project']['version']

          init_text = pathlib.Path('agentweave/__init__.py').read_text()
          init_match = re.search(r"^__version__\s*=\s*['\"]([^'\"]+)['\"]", init_text, re.M)
          assert init_match, 'agentweave.__version__ not found'
          init_version = init_match.group(1)

          cff_text = pathlib.Path('CITATION.cff').read_text()
          cff_match = re.search(r'^version:\s*([^\s]+)\s*$', cff_text, re.M)
          assert cff_match, 'CITATION.cff version not found'
          cff_version = cff_match.group(1).strip("\"'")

          assert package_version == init_version == cff_version, (
              f'version mismatch: pyproject={package_version}, '
              f'agentweave.__version__={init_version}, CITATION.cff={cff_version}'
          )

          ref = '${{ github.ref }}'
          if ref.startswith('refs/tags/'):
              tag = '${{ github.ref_name }}'
              assert tag == 'v' + package_version, (
                  f'tag {tag} does not match package v{package_version}'
              )

          print(f'Version metadata consistent: {package_version}')
          PY
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Create immutable GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ github.ref_name }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$TAG" dist/* --generate-notes --title "AgentWeave $TAG"

  publish-pypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true && startsWith(github.ref, 'refs/tags/v') }}
    needs: build-test-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
