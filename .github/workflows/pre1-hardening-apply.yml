name: Apply pre-1.0 hardening

on:
  push:
    branches:
      - hardening/pre1-complete
    paths:
      - '.github/workflows/pre1-hardening-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: hardening/pre1-complete
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Apply deterministic hardening patches
        run: python scripts/apply_pre1_hardening.py
      - name: Keep workflow mutations for connector-authorized commits
        run: git checkout -- .github/workflows
      - name: Validate patch cleanliness
        run: git diff --check
      - name: Commit patched source, tests, docs, and constraints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'hardening: complete pre-1.0 safety and quality pass'
          git push origin HEAD:hardening/pre1-complete
