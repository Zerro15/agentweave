name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish to PyPI using trusted publishing (tag refs only)
        required: false
        default: false
        type: boolean

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install -U pip build twine && pip install -e '.[dev]'
      - name: Test core
        run: pytest -q
      - name: Test supported upstream integrations
        run: |
          pip install -e '.[dev,all-integrations]'
          pytest -q tests/test_upstream_integration_compat.py tests/test_mcp_real_e2e.py
      - name: Verify release metadata and Zenodo identifiers
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/check_release_metadata.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_release_metadata.py
          fi
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Smoke-install the built wheel with supported integrations
        run: |
          python -m venv /tmp/agentweave-release-smoke
          WHEEL=$(ls dist/*.whl)
          /tmp/agentweave-release-smoke/bin/pip install "${WHEEL}[all-integrations]"
          /tmp/agentweave-release-smoke/bin/python - <<'PY'
          import agentweave
          from agentweave import AgentWeaveApplication, AgentWeaveRuntime, ToolSpec
          from agentweave.integrations.mcp import MCPToolCatalog
          from agentweave.integrations.langgraph import AgentWeaveLangGraphNode
          from agentweave.integrations.autogen import AgentWeaveAutoGenSelector
          assert agentweave.__version__
          assert AgentWeaveApplication and AgentWeaveRuntime and ToolSpec
          assert MCPToolCatalog and AgentWeaveLangGraphNode and AgentWeaveAutoGenSelector
          print('wheel smoke ok', agentweave.__version__)
          PY
          /tmp/agentweave-release-smoke/bin/agentweave version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Create non-overwriting GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ github.ref_name }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$TAG" --draft --generate-notes --title "AgentWeave $TAG"
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false
          IMMUTABLE=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.immutable // false')
          if [ "$IMMUTABLE" != "true" ]; then
            echo "::warning::Repository release immutability is not enabled; enable it in Settings > Releases so future published releases become immutable."
          fi

  publish-pypi:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true && startsWith(github.ref, 'refs/tags/v')) }}
    needs: build-test-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
